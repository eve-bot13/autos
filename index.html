<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería de Autos</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            text-align: center;
        }

        h1 {
            color: #222222;
            margin: 40px;
        }

        .contenedor {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .auto {
            background-color: white;
            width: 350px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
        }

        h2 {
            color: #222222;
        }

        p {
            color: #666666;
        }

    </style>

</head>

<body>

    <h1>🚗 Galería de Autos</h1>

    <div class="contenedor">

        <!-- AUTO 1 -->
        <div class="auto">

            <img src="imagenes/auto1.jpg" alt="Auto deportivo">

            <h2>Auto Deportivo</h2>

            <p>
                Un automóvil moderno, elegante y potente.
            </p>

        </div>


        <!-- AUTO 2 -->
        <div class="auto">

            <img src="imagenes/auto2.jpg" alt="Auto premium">

            <h2>Auto Premium</h2>

            <p>
                Un vehículo elegante con tecnología moderna.
            </p>

        </div>

    </div>

</body>

</html>
