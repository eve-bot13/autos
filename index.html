        .contenedor {
            display: flex;

        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
        }

        h2 {
            color: #222222;
        }

        p {
            color: #666666;
        }

    </style>

</head>
